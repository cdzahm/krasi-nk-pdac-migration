[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nkmigration"
version = "1.0.0"
description = "3D NK-cell migration analysis for time-lapse multiphoton imaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "scikit-image==0.26.0",
    "tifffile==2026.3.3",
    "matplotlib==3.11.1",
    "laptrack==0.17.1",
]

[project.optional-dependencies]
segmentation = ["cellpose==4.2.1.1", "torch==2.5.1"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
